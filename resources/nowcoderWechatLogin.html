<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{cspSource}} https:; style-src {{cspSource}} 'unsafe-inline';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信扫码登录</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--vscode-editor-background, transparent);
            color: #ffffff;
            font-family: var(--vscode-font-family), -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            width: min(360px, calc(100vw - 48px));
            padding: 28px;
            background: transparent;
            text-align: center;
        }

        .logo {
            width: 36px;
            height: 36px;
            margin-bottom: 12px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 20px;
            font-weight: 600;
        }

        p {
            margin: 0;
            color: #ffffff;
            font-size: 13px;
            line-height: 1.6;
        }

        .qr {
            width: 180px;
            height: 180px;
            margin: 22px auto 16px;
            padding: 10px;
            border: 1px solid #d8dee4;
            border-radius: 6px;
            background: #ffffff;
            box-sizing: border-box;
        }

        .qr img {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <main>
        <img class="logo" src="{{iconUri}}" alt="">
        <h1>微信扫码登录牛客</h1>
        <p>请使用微信扫描二维码，关注牛客后完成登录。</p>
        <div class="qr">
            <img src="{{imageUrl}}" alt="微信登录二维码">
        </div>
        <p>二维码有效期约 {{expireSecond}} 秒，扫码成功后窗口会自动关闭。</p>
    </main>
</body>
</html>
